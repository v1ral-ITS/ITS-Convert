name: Public AppImage Demo

on:
  push:
    branches: [main]
    paths:
      - 'itsconvert/**'
      - 'examples/hello.py'
      - '.github/workflows/appimage-build.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  demo:
    runs-on: ubuntu-latest
    env:
      APPIMAGE_EXTRACT_AND_RUN: "1"
      ARCH: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Download standard public appimagetool
        run: |
          mkdir -p "$RUNNER_TEMP/appimage-tools"
          curl -fL --retry 2 https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage -o "$RUNNER_TEMP/appimage-tools/appimagetool"
          chmod +x "$RUNNER_TEMP/appimage-tools/appimagetool"
          echo "$RUNNER_TEMP/appimage-tools" >> "$GITHUB_PATH"
      - name: Build neutral demo with public tools
        run: python -m itsconvert.cli build examples/hello.py --builder appimage --use-appimagetool --output-dir dist
      - name: Execute and checksum AppImage
        run: |
          ./dist/hello-x86_64.AppImage --appimage-extract-and-run
          cd dist
          sha256sum hello-x86_64.AppImage > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: ITS-Convert-public-AppImage-demo
          path: |
            dist/hello-x86_64.AppImage
            dist/SHA256SUMS
          if-no-files-found: error
