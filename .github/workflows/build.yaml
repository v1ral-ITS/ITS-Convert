name: Build and Package

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  native-demo:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install core and public demo packager
        run: python -m pip install -e . pyinstaller
      - name: Build neutral demo
        run: python -m itsconvert.cli build examples/hello.py --builder pyinstaller --output-dir dist
      - name: Execute packaged demo
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            ./dist/hello.exe
          else
            ./dist/hello
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ITS-Convert-demo-${{ runner.os }}
          path: |
            dist/hello
            dist/hello.exe
          if-no-files-found: error
